<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THAscan — THA Block Explorer</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/tha-logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/explorer-shared.css">
<script src="/explorer-shared.js"></script>
<style>
:root{--navy:#1b2540;--navy2:#111a30;--accent:#f7a233;--accent2:#ffcf7a;--bg:#f5f6fa;--card:#fff;--line:#e4e7ee;--ink:#1c2438;--muted:#6b7488;--good:#1a9d5a;--pos:#8156d6}
@media(prefers-color-scheme:dark){:root{--bg:#0c1020;--card:#141b30;--line:#26304d;--ink:#e7eaf2;--muted:#8b93a9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;color:#fff;display:flex;align-items:center;gap:9px}
.brand .logo{width:30px;height:30px;border-radius:50%;display:block;object-fit:contain}
.search{flex:1;min-width:220px;display:flex;gap:0}
.search input{flex:1;border:0;border-radius:8px 0 0 8px;padding:9px 12px;font:inherit;background:#fff;color:#1c2438}
.search button{border:0;border-radius:0 8px 8px 0;background:var(--accent);color:#1b2540;font-weight:700;padding:0 16px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.stat b{display:block;font-size:18px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden}
.card h2{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line);background:rgba(127,127,127,.04)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.tag.pos{background:rgba(129,86,214,.15);color:var(--pos)}.tag.pow{background:rgba(247,162,51,.15);color:var(--accent)}
.tag.cs{background:rgba(26,157,90,.14);color:var(--good)}
.kv{padding:4px 16px}.kv .row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kv .k{color:var(--muted);min-width:150px}.kv .v{flex:1;min-width:200px;word-break:break-all}
.ellip{max-width:340px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.io{grid-template-columns:1fr}}
.io .box{border:1px solid var(--line);border-radius:10px;padding:6px 0}
.io .box h3{margin:0;padding:6px 12px;font-size:12px;color:var(--muted)}
.io .ent{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}.right{text-align:right}
footer{color:var(--muted);text-align:center;padding:22px;font-size:12px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.note{background:rgba(247,162,51,.09);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin:12px 0;font-size:12px}
.chartcard h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chartcard h2 .sp{flex:1}
.ranges{display:flex;gap:4px}
.ranges button{font:inherit;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted)}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#1b2540}
.chartbox{position:relative;padding:10px 10px 4px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox .gl{stroke:var(--line);stroke-width:1}
.chartbox .axis{fill:var(--muted);font-size:10px}
.chartbox .ln{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.chartbox .ar{fill:url(#hrfill)}
.chartbox .hit{fill:transparent}
.chartbox .cur{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chartbox .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{color:var(--accent2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px 4px;font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--muted)}
.legend span.off{opacity:.35;text-decoration:line-through}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
</style>
</head>
<body>
<header><div class="wrap top">
  <a class="brand" href="#/"><img class="logo" src="/tha-logo.png" width="30" height="30" alt=""> THAscan</a>
  <span id="chainbar"></span>
  <form class="search" onsubmit="return doSearch(event)">
    <input id="q" placeholder="Search block height / hash, tx id, or address" spellcheck="false">
    <button>Search</button>
  </form>
</div></header>
<div class="wrap" id="app"><div class="loading">loading…</div></div>
<footer>THAscan · community explorer for the THA chain (PoS) · data from a THA full node</footer>

<script>
// tha-api.wattxchange.app in production; localhost when developing.
const API = new URLSearchParams(location.search).get('api')
  || ((location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://127.0.0.1:3021' : 'https://tha-api.wattxchange.app');
const $=s=>document.querySelector(s);
const app=()=>$('#app');
const api=async p=>{const r=await fetch(API+p);if(!r.ok){let e='error';try{e=(await r.json()).error||e}catch{}throw new Error(e)};return r.json()};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:8});
const ago=t=>{const s=Math.floor(Date.now()/1000-t);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
const short=(h,n=12)=>h?h.slice(0,n)+'…'+h.slice(-6):'';
const link=(t,id,txt,n)=>`<a class="mono" href="#/${t}/${id}">${esc(txt||short(id,n))}</a>`;

function doSearch(e){e.preventDefault();const q=$('#q').value.trim();if(!q)return false;
  api('/api/search?q='+encodeURIComponent(q)).then(r=>{
    if(r.type==='unknown'){app().innerHTML='<div class="note">No block, transaction, or address matches “'+esc(q)+'”.</div>';location.hash='#/';}
    else location.hash='#/'+r.type+'/'+r.id;
  }).catch(()=>{});return false;}

function statsRow(s){
  return `
     <div class="stat"><small>Height</small><b>${s.blocks.toLocaleString()}</b></div>
     <div class="stat"><small>Difficulty</small><b>${Number(s.difficulty).toFixed(4)}</b></div>
     <div class="stat"><small>Net Hashrate</small><b>${ExplorerShared.format.hashrate(s.networkhashps)}</b></div>
     <div class="stat"><small>Peers</small><b>${s.connections??'\u2013'}</b></div>
     <div class="stat"><small>Chain Size</small><b>${(s.sizeOnDisk/1e9).toFixed(2)} GB</b></div>
     <div class="stat"><small>Node</small><b style="font-size:13px">${esc(s.subversion||'')}</b></div>`;
}

// The stat row refreshes on a timer, but the panel must not: remounting it would
// throw away whichever tab and page the reader is on.
let _panel=null,_panelTab=null;
async function home(tab){
  tab = tab || 'blocks';
  if(!document.getElementById('xpanel')){
    app().innerHTML='<div class="stats" id="xstats"><div class="loading">loading network\u2026</div></div>'
      + '<div class="card chartcard"><h2>Network Hashrate'
      + '<span class="sp"></span>'
      + '<span class="ranges" id="hrmode"><button data-m="total" aria-pressed="true">Total</button><button data-m="miners" aria-pressed="false">By miner</button></span>'
      + '<span class="ranges" id="hrranges"></span>'
      + '<button id="hrscale" class="mono" style="font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted)">log</button>'
      + '</h2><div class="chartbox" id="hrbox"><div class="loading">loading hashrate history\u2026</div></div></div>'
      + '<div id="xpanel"></div>';
    _panel = mountPanel(tab); _panelTab = tab;
    initHashrate();
  } else if(_panel && tab !== _panelTab){
    _panelTab = tab; _panel.go(tab, null);
  }
  refreshStats();
}

function refreshStats(){
  return api('/api/status').then(s=>{
    const el=document.getElementById('xstats');
    if(el) el.innerHTML=statsRow(s);
  }).catch(()=>{});
}

// Blocks / transactions / holders / staking, 50 rows a page, paged in either
// direction for as far as the chain goes. Tab changes are mirrored into the URL
// so a view can be linked; the guard stops that write re-entering the router.
let _navGuard=false;
function mountPanel(tab){
  if(!window.ExplorerShared) return null;
  return ExplorerShared.panel('#xpanel',{chainId:'tha',api:API,tab:tab,onNavigate(t){
    if(t===_panelTab) return;
    _panelTab=t; _navGuard=true; location.hash='#/view/'+t;
  }});
}

// ---- network hashrate chart ---------------------------------------------
// Full-chain series from /api/hashrate (fixed-step samples, genesis onward) and
// per-staker breakdown from /api/hashrate/miners. Inline SVG, no CDN.
const HR_RANGES=[['1M',30],['3M',90],['1Y',365],['All',0]];
const HR_COLORS=['#f7a233','#4ea1ff','#57c98b','#e0629b','#b98cff','#f2d24b','#41c9c0','#ff8a5c'];
const HR_TOP=8;
let _hr={data:null,mdata:{},days:0,log:true,mode:'total',hidden:new Set()};

async function initHashrate(){
  const box=document.getElementById('hrbox'); if(!box) return;
  const rg=document.getElementById('hrranges');
  rg.innerHTML=HR_RANGES.map(([l,d])=>`<button data-d="${d}" aria-pressed="${d===_hr.days}">${l}</button>`).join('');
  rg.onclick=e=>{const b=e.target.closest('button'); if(!b)return;
    _hr.days=Number(b.dataset.d);
    [...rg.children].forEach(c=>c.setAttribute('aria-pressed',String(Number(c.dataset.d)===_hr.days)));
    refreshHashrate();};
  const md=document.getElementById('hrmode');
  md.onclick=e=>{const b=e.target.closest('button'); if(!b)return;
    _hr.mode=b.dataset.m;
    [...md.children].forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.m===_hr.mode)));
    refreshHashrate();};
  const sc=document.getElementById('hrscale');
  sc.onclick=()=>{_hr.log=!_hr.log; sc.textContent=_hr.log?'log':'linear'; drawHashrate();};
  try{
    const r=await api('/api/hashrate');
    _hr.data=r.samples||[];
    if(r.building&&_hr.data.length<50) setTimeout(initHashrate,15000);
    drawHashrate();
  }catch(e){ box.innerHTML='<div class="loading">hashrate history unavailable</div>'; }
}

async function refreshHashrate(){
  const box=document.getElementById('hrbox');
  if(_hr.mode==='miners' && !_hr.mdata[_hr.days]){
    box.innerHTML='<div class="loading">loading per-miner history\u2026</div>';
    try{ _hr.mdata[_hr.days]=await api(`/api/hashrate/miners?top=${HR_TOP}&days=${_hr.days}`); }
    catch(e){ box.innerHTML='<div class="loading">per-miner history unavailable</div>'; return; }
  }
  drawHashrate();
}

// a staker's per-bucket share is spiky; smooth it so trends are readable
function hrSmooth(a,w){ if(w<2) return a.slice();
  const o=[];for(let i=0;i<a.length;i++){let s=0,n=0;
    for(let k=Math.max(0,i-w+1);k<=i;k++){s+=a[k];n++;} o.push(s/n);} return o;}

function drawHashrate(){
  const box=document.getElementById('hrbox'); if(!box) return;
  const miners=_hr.mode==='miners';
  let base, series=[];
  if(miners){
    const m=_hr.mdata[_hr.days]; if(!m||!m.buckets) return;
    base=m.buckets.map(b=>({time:b.time,height:b.height,hashps:b.hashps}));
    series=(m.producers||[]).map((p,i)=>({name:p.address,color:HR_COLORS[i%HR_COLORS.length],
      vals:hrSmooth(p.series,5),blocks:p.blocks}));
    if(m.others) series.push({name:'others',color:'var(--muted)',vals:hrSmooth(m.others,5),blocks:null});
  }else{
    if(!_hr.data) return;
    let d=_hr.data;
    if(_hr.days>0){const cut=Date.now()/1000-_hr.days*86400; d=d.filter(p=>p.time>=cut);}
    base=d.filter(p=>p.hashps>0);
    series=[{name:'network',color:'var(--accent)',vals:base.map(p=>p.hashps),area:true}];
  }
  if(base.length<2){ box.innerHTML='<div class="loading">not enough data for this range</div>'; return; }

  const vis=series.filter(s=>!_hr.hidden.has(s.name));
  const W=1000,H=260,L=66,R=10,T=12,B=24;
  const xs=i=>L+(W-L-R)*(i/(base.length-1));
  let all=[];vis.forEach(s=>s.vals.forEach(v=>{if(v>0)all.push(v)}));
  if(!all.length) all=[1];
  const lo=Math.min(...all),hi=Math.max(...all);
  const f=v=>_hr.log?Math.log10(Math.max(v,1)):v;
  let y0=f(lo),y1=f(hi); if(y1-y0<1e-9) y1=y0+1;
  const pad=(y1-y0)*0.08; y0-=pad; y1+=pad;
  const ys=v=>T+(H-T-B)*(1-(f(v)-y0)/(y1-y0));

  const pathOf=vals=>{let d='',pen=false;
    vals.forEach((v,i)=>{ if(v<=0&&_hr.log){pen=false;return;}
      d+=(pen?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)+' '; pen=true;});
    return d.trim();};

  const ticks=[];for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4;
    ticks.push({y:T+(H-T-B)*(1-k/4),v:_hr.log?Math.pow(10,v):v});}
  const dateLbl=t=>new Date(t*1000).toLocaleDateString(undefined,{month:'short',year:'2-digit'});

  const areaTop=vis[0]&&vis[0].area?`<path class="ar" d="${pathOf(vis[0].vals)} L${xs(base.length-1).toFixed(1)} ${H-B} L${xs(0).toFixed(1)} ${H-B} Z"/>`:'';

  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="THA network hashrate over time">
    <defs><linearGradient id="hrfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="gl" x1="${L}" y1="${t.y.toFixed(1)}" x2="${W-R}" y2="${t.y.toFixed(1)}"/>
      <text class="axis" x="${L-6}" y="${(t.y+3).toFixed(1)}" text-anchor="end">${ExplorerShared.format.hashrate(t.v)}</text>`).join('')}
    ${areaTop}
    ${vis.map(s=>`<path class="ln" style="stroke:${s.color}" d="${pathOf(s.vals)}"/>`).join('')}
    <text class="axis" x="${L}" y="${H-6}">${dateLbl(base[0].time)}</text>
    <text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${dateLbl(base[base.length-1].time)}</text>
    <line class="cur" id="hrcur" x1="0" y1="${T}" x2="0" y2="${H-B}" style="opacity:0"/>
    <rect class="hit" id="hrhit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/>
  </svg><div class="tip" id="hrtip"></div>
  ${miners?`<div class="legend" id="hrleg">${series.map(s=>
    `<span data-n="${esc(s.name)}" class="${_hr.hidden.has(s.name)?'off':''}"><i style="background:${s.color}"></i>${
      s.name==='others'?'others':esc(short(s.name,10))}${s.blocks!=null?` <span class="muted">${s.blocks.toLocaleString()}b</span>`:''}</span>`
    ).join('')}</div>`:''}`;

  if(miners){
    box.querySelector('#hrleg').onclick=e=>{const t=e.target.closest('span[data-n]'); if(!t)return;
      const n=t.dataset.n; _hr.hidden.has(n)?_hr.hidden.delete(n):_hr.hidden.add(n); drawHashrate();};
  }

  const svg=box.querySelector('svg'),hit=box.querySelector('#hrhit');
  const cur=box.querySelector('#hrcur'),tip=box.querySelector('#hrtip');
  hit.addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect();
    let i=Math.round(((ev.clientX-r.left)/r.width*W-L)/((W-L-R)/(base.length-1)));
    i=Math.max(0,Math.min(base.length-1,i));
    const x=xs(i); cur.setAttribute('x1',x); cur.setAttribute('x2',x); cur.style.opacity=1;
    tip.style.opacity=1; tip.style.left=(x/W*r.width)+'px'; tip.style.top=(ys(vis[0].vals[i]||1)/H*r.height)+'px';
    tip.innerHTML=`block ${base[i].height.toLocaleString()} · ${new Date(base[i].time*1000).toLocaleDateString()}<br>`
      + vis.slice(0,6).map(s=>`<span style="color:${s.color}">\u25a0</span> ${
          s.name==='network'?'network':(s.name==='others'?'others':short(s.name,8))}: <b>${
          ExplorerShared.format.hashrate(s.vals[i]||0)}</b>`).join('<br>');
  });
  hit.addEventListener('mouseleave',()=>{cur.style.opacity=0;tip.style.opacity=0;});
}

async function viewBlock(id){
  app().innerHTML='<div class="loading">loading block…</div>';
  const b=await api('/api/block/'+encodeURIComponent(id));
  app().innerHTML=`
   <div class="card"><h2>Block #${b.height} <span class="tag ${b.type==='PoS'?'pos':'pow'}">${b.type}</span></h2>
    <div class="kv">
     <div class="row"><span class="k">Hash</span><span class="v mono">${esc(b.hash)}</span></div>
     <div class="row"><span class="k">Timestamp</span><span class="v">${new Date(b.time*1000).toUTCString()} (${ago(b.time)})</span></div>
     <div class="row"><span class="k">Transactions</span><span class="v">${b.nTx}</span></div>
     <div class="row"><span class="k">Size / Weight</span><span class="v">${b.size} B / ${b.weight}</span></div>
     <div class="row"><span class="k">Difficulty</span><span class="v">${Number(b.difficulty).toFixed(6)}</span></div>
     <div class="row"><span class="k">Merkle Root</span><span class="v mono">${esc(b.merkleroot)}</span></div>
     <div class="row"><span class="k">Prev / Next</span><span class="v">${b.previousblockhash?link('block',b.previousblockhash,short(b.previousblockhash)):'–'} ${b.nextblockhash?' → '+link('block',b.nextblockhash,short(b.nextblockhash)):''}</span></div>
    </div></div>
   <div class="card"><h2>Transactions (${b.tx.length})</h2><table>
     <tr><th>Txid</th><th>In/Out</th><th>Value</th><th></th></tr>
     ${b.tx.map((t,i)=>`<tr>
       <td>${link('tx',t.txid,short(t.txid,16))}</td>
       <td class="muted">${t.vin} → ${t.vout}</td>
       <td>${fmt(t.value)} THA</td>
       <td>${i===0?'<span class="tag cs">coinbase</span>':(i===1&&b.type==='PoS'?'<span class="tag cs">coinstake</span>':'')}</td></tr>`).join('')}
   </table></div>`;
}

async function viewTx(id){
  app().innerHTML='<div class="loading">loading transaction…</div>';
  const t=await api('/api/tx/'+id);
  const io=(arr,side)=>`<div class="box"><h3>${side} (${arr.length})</h3>${arr.map(e=>{
    if(e.coinbase)return '<div class="ent"><span class="muted">Newly generated (coinbase)</span></div>';
    const a=e.address?link('address',e.address,short(e.address,14)):'<span class="muted">unparsed</span>';
    return `<div class="ent">${a}<span>${e.value==null?'':fmt(e.value)+' THA'}</span></div>`;}).join('')||'<div class="ent muted">none</div>'}</div>`;
  app().innerHTML=`
   <div class="card"><h2>Transaction ${t.coinstake?'<span class="tag cs">coinstake</span>':t.coinbase?'<span class="tag cs">coinbase</span>':''}</h2>
    <div class="kv">
     <div class="row"><span class="k">Txid</span><span class="v mono">${esc(t.txid)}</span></div>
     <div class="row"><span class="k">Block</span><span class="v">${t.height!=null?link('block',t.height,t.height):'unconfirmed'} · ${t.confirmations||0} confirmations</span></div>
     <div class="row"><span class="k">Time</span><span class="v">${t.time?new Date(t.time*1000).toUTCString():'–'}</span></div>
     <div class="row"><span class="k">Value out</span><span class="v">${fmt(t.outTotal)} THA</span></div>
     <div class="row"><span class="k">Fee</span><span class="v">${fmt(t.fee)} THA</span></div>
    </div></div>
   <div class="card"><h2>Inputs & Outputs</h2><div class="kv"><div class="io">${io(t.vin,'Inputs')}${io(t.vout,'Outputs')}</div></div></div>`;
}

async function viewAddress(id){
  app().innerHTML='<div class="loading">scanning address (this can take up to a minute — THA has no address index)…</div>';
  const a=await api('/api/address/'+id);
  app().innerHTML=`
   <div class="card"><h2>Address</h2>
    <div class="kv">
     <div class="row"><span class="k">Address</span><span class="v mono">${esc(a.address)}</span></div>
     <div class="row"><span class="k">Balance</span><span class="v"><b>${fmt(a.balance)} THA</b></span></div>
     <div class="row"><span class="k">Unspent outputs</span><span class="v">${a.utxoCount.toLocaleString()}</span></div>
    </div></div>
   ${a.utxoCount>a.utxos.length?`<div class="note">Showing the ${a.utxos.length} most recent of ${a.utxoCount.toLocaleString()} UTXOs.</div>`:''}
   <div class="card"><h2>Unspent Outputs</h2><table>
     <tr><th>Txid</th><th>Vout</th><th>Height</th><th class="right">Value</th></tr>
     ${a.utxos.map(u=>`<tr><td>${link('tx',u.txid,short(u.txid,16))}</td><td>${u.vout}</td><td>${link('block',u.height,u.height)}</td><td class="right">${fmt(u.value)} THA</td></tr>`).join('')||'<tr><td colspan="4" class="muted">no unspent outputs</td></tr>'}
   </table></div>`;
}

async function router(){
  if(_navGuard){_navGuard=false;return;}
  const h=location.hash.replace(/^#\//,'');const [t,id]=h.split('/');
  try{
    if(!t) return home();
    if(t==='view') return home(id||'blocks');
    if(t==='block'){_panel=null;_panelTab=null;return viewBlock(id);}
    if(t==='tx'){_panel=null;_panelTab=null;return viewTx(id);}
    if(t==='address'){_panel=null;_panelTab=null;return viewAddress(id);}
    home();
  }catch(e){app().innerHTML='<div class="note">'+esc(e.message)+'</div>';}
}
if(window.ExplorerShared) ExplorerShared.chainbar('#chainbar',{chainId:'tha'});
addEventListener('hashchange',router);
router();
setInterval(()=>{if(document.getElementById('xstats'))refreshStats();},30000);
</script>
</body>
